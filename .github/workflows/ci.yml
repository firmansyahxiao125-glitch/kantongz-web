name: CI

on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }

      - run: npm ci

      # Tidak ada `continue-on-error` di mana pun. Gerbang yang boleh dilewati
      # bukan gerbang.
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint

      # Logika MURNI yang salahnya tidak terlihat di layar sampai terlambat:
      # pembagian nol pada persentase uang, dan keputusan tingkat grafis yang
      # menentukan apakah bundel 341 KB diunduh sebuah ponsel.
      - name: Tes
        run: npm test

      # Audit kontras berjalan di CI, bukan hanya di mesin perancang.
      #
      # Ia MEMBACA `globals.css` dan menghitung rasio setiap pasangan
      # teks/permukaan terhadap WCAG 2.1 AA. Satu nilai warna yang diubah
      # tanpa memeriksa akibatnya akan memerahkan pipeline sebelum sampai ke
      # pengguna — dan pengguna yang tidak dapat membaca nominalnya tidak akan
      # melaporkannya sebagai bug, ia hanya berhenti memakai aplikasinya.
      - name: Kontras WCAG AA
        run: npm run contrast

      - name: Build
        run: npm run build

      # Gerbang tipografi berjalan SESUDAH build, dan itu wajib: ia menguji
      # kaskade CSS yang sudah dirender, bukan berkas sumbernya.
      #
      # Cacat yang dijaganya lolos dari SETIAP langkah di atas. `--font-sans`
      # menghitung menjadi string kosong karena `var()`-nya disubstitusi di
      # `:root` sementara masukannya dipasang di `<body>` — deklarasinya tetap
      # hadir dan benar di CSS terbangun, jadi tidak ada pemeriksaan statis
      # yang dapat melihatnya. Aplikasinya tampil dengan font sistem sementara
      # typecheck, lint, uji, dan build seluruhnya hijau.
      #
      # Chrome sudah terpasang di runner `ubuntu-latest`; tidak ada peramban
      # yang diunduh dan tidak ada dependensi yang ditambahkan.
      #
      # ── MENGAPA `node server.js`, BUKAN `next start` ────────────────────
      #
      # `next.config.ts` memakai `output: 'standalone'`, dan Next MENOLAK
      # `next start` pada konfigurasi itu:
      #
      #   ⚠ "next start" does not work with "output: standalone" configuration.
      #     Use "node .next/standalone/server.js" instead.
      #
      # Yang lebih penting daripada peringatannya: `node server.js` dari bundel
      # standalone adalah PERSIS yang dijalankan produksi (lihat `CMD` di
      # Dockerfile). Gerbang yang menguji peladen berbeda dari yang dikirim
      # sedang menguji sesuatu yang tidak pernah ada di produksi.
      #
      # Perakitannya meniru Dockerfile baris demi baris: keluaran `standalone`
      # SENGAJA tidak memuat aset statis — Next menyerahkan penyalinannya ke
      # tahap penyebaran. Tanpa `.next/static`, seluruh CSS menjawab 404 dan
      # gerbang ini akan gagal karena alasan yang SALAH.
      #
      # `public/` disalin bersyarat: direktorinya kosong, dan Git tidak melacak
      # direktori kosong — jadi ia tidak ada sesudah checkout.
      #
      # `HOSTNAME` DISETEL EKSPLISIT, dan ini bukan kehati-hatian berlebih.
      #
      # `server.js` standalone memakai `process.env.HOSTNAME || '0.0.0.0'`.
      # Docker dan runner CI keduanya sudah menyetel `HOSTNAME` — ke ID
      # kontainer atau nama mesin runner. Peladen lalu mengikat ke nama itu,
      # dan `http://localhost:3100` TIDAK PERNAH menjawab:
      #
      #   - Local: http://2aed865e3bb6:3100
      #   peladen standalone: HTTP 000
      #   Peladen di http://localhost:3100 tidak pernah menjawab.  (exit 2)
      #
      # Diamati langsung saat menjalankan langkah ini di dalam kontainer Linux,
      # bukan diduga. Versi Windows lolos hanya karena `HOSTNAME` disetel
      # manual di sana — persis jenis perbedaan yang membuat langkah CI hijau
      # di laptop dan merah di runner.
      #
      # KEDUA gerbang peramban berbagi SATU peladen, dan itu disengaja.
      # Menyalakannya dua kali menggandakan waktu boot dan menambah satu titik
      # gagal yang tidak menguji apa pun. `set -e` membuat kegagalan gerbang
      # mana pun langsung memerahkan langkah ini.
      - name: Gerbang peramban (tipografi + keluaran terender)
        run: |
          set -e
          cp -r .next/static .next/standalone/.next/static
          if [ -d public ]; then cp -r public .next/standalone/public; fi
          PORT=3100 HOSTNAME=127.0.0.1 node .next/standalone/server.js &
          node scripts/typography.mjs --base http://localhost:3100
          node scripts/render.mjs --base http://localhost:3100

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci

      - name: Audit dependensi produksi
        run: npm audit --omit=dev --audit-level=high

      - name: Bangkitkan SBOM
        run: npx --yes @cyclonedx/cyclonedx-npm@latest --omit dev --output-file sbom.json

      - uses: actions/upload-artifact@v4
        with:
          name: sbom-web
          path: sbom.json
          retention-days: 90

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build citra
        uses: docker/build-push-action@v6
        with: { context: ., push: false, tags: 'kantongz-web:ci' }
